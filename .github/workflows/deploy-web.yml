name: Deploy web companion to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "tools/build_web.py"
      - "tools/export_design_tokens.py"
      - "src/app_metadata.py"
      - "src/config/design_tokens.py"
      - "src/domain/molar_mass.py"
      - "data/raw/elements.json"
      - "data/localization/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Assemble web bundle
        run: python tools/build_web.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
